{% extends "base.html" %}
{% block content %}

<section class="section">
  <div class="container">
    <div class="gallery-grid">
      {% for img in images %}
      <div class="gallery-item">
        <img src="{{ url_for('static', filename='images/gallery/' + img) }}" alt="Скриншот">
      </div>
      {% else %}
      <p class="s-text">Здесь пока нет скриншотов. Но скоро они появятся!</p>
      {% endfor %}
    </div>
    <p class="gallery-hint">Скриншоты находятся в папке <code>static/images/gallery/</code></p>
  </div>
</section>

{% endblock %}
