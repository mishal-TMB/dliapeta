{% extends "base.html" %}
{% block content %}

<section class="section">
  <div class="container">
    <a href="{{ url_for('novosti') }}" class="back-link">← Все новости</a>
    <div class="news-full">
      <div class="news-full-header">
        <h1 class="news-full-title">{{ item.title }}</h1>
        <span class="news-date">{{ item.formatted_date() }}</span>
      </div>
      {% if item.image_file %}
      <div class="news-full-image">
        <img src="{{ url_for('static', filename='uploads/' + item.image_file) }}" alt="{{ item.title }}">
      </div>
      {% endif %}
      <div class="news-full-body">
        {{ item.content | replace('\n', '<br>') | safe }}
      </div>
    </div>
  </div>
</section>

{% endblock %}
