<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNOWIX — {{ page }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="{{ url_for('glavnoe') }}" class="nav-logo">SNOWIX</a>
    <ul class="nav-links">
        <li><a href="{{ url_for('glavnoe') }}"   class="{{ 'active' if page=='главное' }}">главное</a></li>
        <li><a href="{{ url_for('pravila') }}"   class="{{ 'active' if page=='правила' }}">правила</a></li>
        <li><a href="{{ url_for('sborka') }}"    class="{{ 'active' if page=='сборка' }}">сборка</a></li>
        <li><a href="{{ url_for('novosti') }}"   class="{{ 'active' if page=='новости' }}">новости</a></li>
        <li><a href="{{ url_for('galereya') }}"  class="{{ 'active' if page=='галерея' }}">галерея</a></li>
        <li><a href="{{ url_for('karta') }}"     class="{{ 'active' if page=='карта' }}">карта</a></li>
        <li><a href="{{ url_for('donat') }}"     class="nav-donat {{ 'active' if page=='донат' }}">донат</a></li>
    </ul>
</nav>

<!-- HERO -->
<header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
        <h1 class="hero-title">SNOWIX</h1>
        <p class="hero-subtitle">3-ий сезон{% if page != 'главное' %} · {{ page }}{% endif %}</p>
    </div>
</header>

<div class="sep"></div>

<main>{% block content %}{% endblock %}</main>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-inner">
        <div class="footer-left">
            <span class="footer-logo">SNOWIX</span>
            <span class="footer-sub">SMP · Версия 26.1 · 3-й сезон</span>
        </div>
        <div class="footer-socials">
            <!-- ВК -->
            <a href="#" class="soc" title="ВКонтакте">

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
