<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SNOWIX — {{ 'Редактировать' if item else 'Новая новость' }}</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-sidebar-logo">SNOWIX</div>
      <nav class="admin-sidebar-nav">
        <a href="{{ url_for('admin_dashboard') }}" class="admin-nav-link">📰 Новости</a>
        <a href="{{ url_for('admin_news_add') }}" class="admin-nav-link active">➕ Добавить новость</a>
        <a href="{{ url_for('glavnoe') }}" class="admin-nav-link" target="_blank">🌐 Открыть сайт</a>
      </nav>
      <a href="{{ url_for('admin_logout') }}" class="admin-logout">Выйти →</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1 class="admin-page-title">{{ 'Редактировать новость' if item else 'Новая новость' }}</h1>
        <a href="{{ url_for('admin_dashboard') }}" class="admin-btn-back">← Назад</a>
      </div>

      <div class="admin-form-wrap">
        <form method="POST" class="admin-form" enctype="multipart/form-data">
          <label class="admin-label">Заголовок</label>
          <input type="text" name="title" class="admin-input" required
            value="{{ item.title if item else '' }}" placeholder="Название новости">

          <label class="admin-label">Текст новости</label>
          <textarea name="content" class="admin-textarea" required
            placeholder="Напишите текст новости...">{{ item.content if item else '' }}</textarea>

          <label class="admin-label">Дата публикации</label>
          <input type="datetime-local" name="created_at" class="admin-input"
            value="{{ item.created_at.isoformat()[:16] if item else '' }}">

          <label class="admin-label">Изображение (превью)</label>
          {% if item and item.image_file %}
            <div style="margin-bottom: 10px;">
              <img src="{{ url_for('static', filename='uploads/' + item.image_file) }}" style="max-width: 200px; border-radius: 8px;">
              <p style="font-size: 12px; color: #888;">Текущее изображение: {{ item.image_file }}</p>
            </div>
          {% endif %}
          <input type="file" name="image" class="admin-input" accept="image/*">

          <button type="submit" class="admin-btn-primary">
            {{ 'Сохранить изменения' if item else 'Опубликовать' }}
          </button>
        </form>
      </div>
    </main>
  </div>

</body>
</html>
