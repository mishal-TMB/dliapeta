<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SNOWIX — Вход в панель</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="admin-body">
  <div class="admin-login-wrap">
    <div class="admin-login-box">
      <h1 class="admin-login-title">SNOWIX</h1>
      <p class="admin-login-sub">Панель управления</p>
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="admin-flash error">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}
      <form method="POST" class="admin-form">
        <input type="text" name="login" placeholder="Логин" required class="admin-input">
        <input type="password" name="password" placeholder="Пароль" required class="admin-input">
        <button type="submit" class="admin-btn-primary">Войти</button>
      </form>
    </div>
  </div>
</body>
</html>
